spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  config:
    import: optional:file:.env[.properties]

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
              - account_email
            client-name: Kakao

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
              - profile_image
            client-name: Naver

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

tour-api:
  service-key: ${TOUR_API_SERVICE_KEY}
  mobile-os: ETC
  mobile-app: ModuTrip
  response-type: json
  kor-service-base-url: https://apis.data.go.kr/B551011/KorService2
  kor-with-service-base-url: https://apis.data.go.kr/B551011/KorWithService2

kakao:
  mobility:
    rest-api-key: ${KAKAO_REST_API_KEY}
    base-url: https://apis-navi.kakaomobility.com

tour-initial-load:
  enabled: false
  accessible-enabled: true
  general-enabled: false
  max-pages-per-run: 300
  cron: "0 10 21 * * *"
  zone: "Asia/Seoul"

tour-batch:
  enabled: true
  cron: "0 45 21 * * *"
  zone: Asia/Seoul
  # max-pages: 50
  detail-batch-size: 450

tour-removed-check:
  enabled: true
  cron: "0 0 5 ? * SUN"
  zone: Asia/Seoul

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-millis: 1800000
  refresh-token-expiration-millis: 1209600000


app:
  cookie:
    secure: ${APP_COOKIE_SECURE:false}
    same-site: ${APP_COOKIE_SAME_SITE:Lax}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth/success}

gms:
  openai:
    api-key: ${GMS_KEY}
    model: gpt-4o-mini
    base-url: https://gms.ssafy.io/gmsapi/api.openai.com/v1/chat/completions

  gemini:
    api-key: ${GMS_KEY}
    model: gemini-2.5-flash
    base-url: https://gms.ssafy.io/gmsapi/generativelanguage.googleapis.com/v1beta

firebase:
  project-id: ${FIREBASE_PROJECT_ID}
  client-email: ${FIREBASE_CLIENT_EMAIL}
  private-key: ${FIREBASE_PRIVATE_KEY}
  private-key-id: ${FIREBASE_PRIVATE_KEY_ID}
  client-id: ${FIREBASE_CLIENT_ID}
  token-uri: ${FIREBASE_TOKEN_URI:https://oauth2.googleapis.com/token}
